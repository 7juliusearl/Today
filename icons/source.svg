<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="mask">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f2e9"/>
      <stop offset="1" stop-color="#ece5d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8491d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8491d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8491d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e8491d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#mask)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="150" cy="130" r="420" fill="url(#glow)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="none" stroke="#17140f" stroke-opacity="0.05" stroke-width="2"/>
  </g>

  <rect x="440" y="300" width="100" height="420" rx="24" fill="#17140f"/>
  <rect x="300" y="300" width="380" height="90" rx="24" fill="#17140f"/>

  <circle cx="670" cy="670" r="90" fill="url(#dotGlow)"/>
  <circle cx="670" cy="670" r="54" fill="#e8491d"/>
</svg>
